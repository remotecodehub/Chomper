services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.13
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  nakama:
    image: heroiclabs/nakama:latest
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address "${NAKAMA_DB_ADDRESS}" &&
        /nakama/nakama
        --database.address "${NAKAMA_DB_ADDRESS}"
        --logger.level "${NAKAMA_LOG_LEVEL}"
        --console.username "${NAKAMA_CONSOLE_USERNAME}"
        --console.password "${NAKAMA_CONSOLE_PASSWORD}"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    volumes:
      - ./nakama:/nakama/data
